name: CI/CD - Build, DevSecOps, ECR and GitOps

on:
    push:
        branches: [master]
        paths-ignore:
            - "k8s/**"
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}
    AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    ECR_REPO: ${{ secrets.ECR_REPO }}

jobs:
    checkout:
        name: Checkout Repository
        runs-on: ubuntu-latest
        outputs:
            commit: ${{ steps.commit.outputs.sha }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Set commit SHA
              id: commit
              run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

    build-react-frontend:
        name: Build and Push React Frontend Docker Image to ECR
        runs-on: ubuntu-latest
        needs: checkout
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Login to Amazon ECR
              uses: aws-actions/amazon-ecr-login@v2.1.7

            - name: Build and push Docker image
              env:
                  COMMIT_SHA: ${{ needs.checkout.outputs.commit }}
              run: |
                  set -euo pipefail

                  TAG="${COMMIT_SHA}-${GITHUB_RUN_NUMBER}"
                  IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${TAG}"

                  docker build --pull -t "$IMAGE" .
                  docker push "$IMAGE"

    update-manifests:
        name: Update Kubernetes Manifests
        runs-on: ubuntu-latest
        needs: [checkout, build-react-frontend]
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1
              with:
                  ref: master
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update manifest
              env:
                  COMMIT_SHA: ${{ needs.checkout.outputs.commit }}
              run: |
                  set -euo pipefail

                  TAG="${COMMIT_SHA}-${GITHUB_RUN_NUMBER}"
                  IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${TAG}"

                  test -f k8s/deployment.yaml

                  sed -i -E \
                    "s|^([[:space:]]*image:[[:space:]]*).*$|\1${IMAGE}|" \
                    k8s/deployment.yaml

                  git diff --check
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add k8s/deployment.yaml

                  if git diff --cached --quiet; then
                    echo "No manifest changes."
                    exit 0
                  fi

                  git commit -m "chore(gitops): update image to ${TAG}"
                  git push origin HEAD:master

    notify-argocd:
        name: Notify ArgoCD for Deployment
        runs-on: ubuntu-latest
        needs: update-manifests
        if: github.ref == 'refs/heads/master'
        steps:
            - name: Trigger ArgoCD Sync
              run: |
                    curl -k -X POST -u ${{ secrets.ARGOCD_USERNAME }}:${{ secrets.ARGOCD_PASSWORD }} \
                    https://${{ secrets.ARGOCD_HOST }}/api/v1/applications/${{ secrets.ARGOCD_APP_NAME }}/sync

    cleanup:
        name: Cleanup Old ECR Images
        runs-on: ubuntu-latest
        needs: [build-react-frontend, update-manifests, notify-argocd]
        if: >-
            success() &&
            github.ref == 'refs/heads/master' &&
            github.event_name != 'pull_request'

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Keep latest two ECR images
              run: |
                  set -euo pipefail

                  mapfile -t DIGESTS < <(
                    aws ecr describe-images \
                      --repository-name "$ECR_REPO" \
                      --region "$AWS_REGION" \
                      --query 'sort_by(imageDetails,&imagePushedAt)[].imageDigest' \
                      --output text |
                    tr '\t' '\n' |
                    sed '/^None$/d; /^$/d'
                  )

                  COUNT=${#DIGESTS[@]}
                  echo "Found $COUNT image digests."

                  if [ "$COUNT" -le 2 ]; then
                    echo "Nothing to delete."
                    exit 0
                  fi

                  DELETE_COUNT=$((COUNT - 2))

                  for ((i=0; i<DELETE_COUNT; i++)); do
                    aws ecr batch-delete-image \
                      --repository-name "$ECR_REPO" \
                      --region "$AWS_REGION" \
                      --image-ids "imageDigest=${DIGESTS[$i]}"
                  done

                  echo "ECR cleanup complete."
