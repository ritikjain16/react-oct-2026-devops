apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend-deployment
  labels:
    app: react-frontend
  namespace: mynodejs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend

    spec:
      containers:
        - name: react-frontend
          image: 280681471871.dkr.ecr.ap-south-1.amazonaws.com/react-frontend-2026:d010a8c8f05da407f0b57444515ea99ec4ca5cba-4
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: react-frontend-config
                  key: API_URL